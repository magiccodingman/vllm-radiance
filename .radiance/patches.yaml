    provenance: {kind: upstream-backport, upstream_pr: 'vLLM #52805/#53046', evidence: docs/V028_UPGRADE.md}
  patch_xgrammar_spec_termination:
    removed_at: v0.30; historical source at 285ac78e7f19bc1e1b5b09b25f865aea0c6d9754
    v030_disposition: UPSTREAM_OWNED
    active: false
    activation: historical
    status: upstream-owned-v030
    areas: [structured-output, xgrammar, speculative]
    reason: Backport speculative grammar termination handling so draft batches cannot overrun a terminated FSM.
    runner: independent
    provenance: {kind: upstream-backport, upstream_pr: 'vLLM #52805/#53046', evidence: docs/V028_UPGRADE.md}
  install_radiance_hooks:
