  patch_parser_shared_engine:
    removed_at: v0.30; historical source at 285ac78e7f19bc1e1b5b09b25f865aea0c6d9754
    v030_disposition: UPSTREAM_OWNED
    active: false
    activation: historical
    status: upstream-owned-v030
    areas: [parser, tools, correctness]
    reason: Backport the v0.28 shared-parser fix that preserves registered reasoning/tool adapters and structural tags.
    runner: independent
    provenance: {kind: upstream-backport, upstream_pr: 'vLLM #52830', upstream_commit: 46638857fdbb30e0c232c9e8f9cb1ff6d6f545c3, evidence: docs/V028_UPGRADE.md}
  patch_preshuffle:
    v030_disposition: RETAIN_UNCHANGED
    areas: [fp8, gemm, weights]
    reason: Install Radiance preshuffled FP8 weight handling and dispatcher integration.
    runner: both
  patch_quark_bf16_mtp:
    v030_disposition: RETAIN_UNCHANGED
    areas: [mxfp4, quark, mtp]
    reason: Allow the qualified Quark checkpoint's BF16 MTP tensors only when explicitly selected.
    runner: both
  patch_quark_mxfp4:
    v030_disposition: MECHANICAL_PORT
    areas: [mxfp4, quark, quantization]
    reason: Register and route native Quark MXFP4/W4A8 on gfx1201.
    runner: both
    provenance: {kind: selective-adaptation, source: ggz14/radiance-vllm-mxfp4 lineage, evidence: docs/MXFP4_W4A8_R9700.md}
  patch_qwen3_toolparse:
    v030_disposition: RETAIN_UNCHANGED
    areas: [parser, qwen, tools]
    reason: Preserve Qwen3 tool/reasoning parser behavior required by Radiance tool-call qualification.
    runner: independent
  patch_qwen_open_object_schema:
    v030_disposition: RETAIN_UNCHANGED
    areas: [parser, tools, structured-output]
    reason: Preserve open nested-object schemas used by deferred-tool wrappers instead of flattening/restricting arguments.
    runner: independent
  patch_r4d:
    v030_disposition: MECHANICAL_PORT
    areas: [libr4d, attention, gdn]
    reason: Integrate libr4d operators with the pinned vLLM model/runtime paths.
    runner: both
  patch_radiance_dispatch:
    v030_disposition: RETAIN_UNCHANGED
    areas: [quantization, fp8, dispatch]
    reason: Install Radiance FP8 dispatch selection and guarded fallbacks.
    runner: both
  patch_rocm_cudagraph_current_stream:
    v030_disposition: UPSTREAM_OWNED
    active: false
    activation: historical
    status: upstream-owned-v030
    areas: [rocm, cudagraph, correctness]
    reason: Backport vLLM's post-v0.28 ROCm graph capture fix to use the current stream.
    runner: both
    provenance: {kind: upstream-backport, upstream_pr: 'vLLM #53818', upstream_commit: 080a66a69c6fd1fe464756f88ab958baad66ce69, evidence: docs/V028_UPGRADE.md}
  patch_skinny_gemm:
    v030_disposition: RETAIN_UNCHANGED
    areas: [gemm, decode]
    reason: Route qualified skinny GEMM shapes through Radiance-tuned implementations.
    runner: both
  patch_topk_composite:
    v030_disposition: RETAIN_UNCHANGED
    areas: [sampling, topk]
    reason: Install the bounded composite top-k path with exact fallback.
    runner: both
  patch_topk_triton_rows:
    v030_disposition: UPSTREAM_OWNED
    active: false
    activation: historical
    status: upstream-owned-v030
    areas: [sampling, topk]
    reason: Route small-row top-k work through the qualified Triton path.
    runner: both
  patch_unified_attention_lds:
    v030_disposition: RETAIN_UNCHANGED
    areas: [attention, rocm]
    reason: Retain the qualified broader ROCm LDS fit/tuning guard for unified attention.
    runner: both
  patch_unpad:
    v030_disposition: RETAIN_UNCHANGED
    areas: [runtime, tensor-shapes]
    reason: Carry Radiance's guarded unpadding compatibility behavior.
    runner: unknown
  patch_verify_head:
    v030_disposition: MECHANICAL_PORT
    areas: [dflash, sampling, speculative]
    reason: Install the sampling-aware target verification head with exact fallback.
    runner: v2
