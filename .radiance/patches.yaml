schema_version: 1
defaults:
  component: vllm
  active: true
  activation: dockerfile-direct
  status: active
  runner: unknown
  baseline_tests:
  - python-compile
  provenance:
    kind: radiance-lineage-or-local
    evidence: source comments, Git history, and qualification reports; exact external provenance not asserted here
  remove_when: Re-audit on relevant upstream upgrades; remove when equivalent upstream behavior is present and qualified.
area_tests:
  allreduce:
  - r9700-tp2-smoke
  - betterbench-standard
  mxfp4:
  - r9700-tp2-smoke
  - betterbench-standard
  gdn:
  - r9700-tp2-smoke
  - correctness-equivalence
  attention:
  - r9700-tp2-smoke
  - betterbench-standard
  dflash:
  - r9700-tp2-smoke
  - correctness-equivalence
  - betterbench-standard
  speculative:
  - r9700-tp2-smoke
  - correctness-equivalence
  parser:
  - parser-shared-engine-image
  - tool-schema-live
  structured-output:
  - xgrammar-spec-image
  - qwen-open-object-image
  - tool-schema-live
  - open-object-tool-live
  kv-offload:
  - kv-offload-registration-cpu
  - kv-offload-rank-sharded-cpu
  - kv-offload-restore-cpu
runner_values:
- v1
- v2
- both
- independent
- unknown
activation_values:
- dockerfile-direct
- indirect
- historical
policy:
  prefer_upstream_ownership: true
  upgrade_rule: Classify each active overlay as upstream-owned, still-required, mechanical-drift, semantic-migration, obsolete, deprecated-architecture debt, or Tier-3.
  gate_rule: Required gates may be strengthened but not silently weakened or removed to make a candidate pass.
patches:
  patch_ar_geometry:
    v030_disposition: RETAIN_UNCHANGED
    areas: [allreduce, tp2, performance]
    reason: Expose the measured TP2 compressed all-reduce geometry controls.
    runner: both
  patch_ar_maxbytes:
    v030_disposition: RETAIN_UNCHANGED
    areas: [allreduce, tp2]
    reason: Retain exact-message size limits for the qualified Radiance TP2 collective path.
    runner: both
  patch_conv1d_blockn:
    v030_disposition: RETAIN_UNCHANGED
    areas: [gdn, conv1d]
    reason: Retain block-N compatibility for the qualified GDN/conv1d path.
    runner: both
  patch_dflash2_v0271_backport:
    v030_disposition: OBSOLETE_DELETE
    areas: [dflash, historical]
    reason: Historical v0.27.1 DFlash2 source-copy backport; retained only for archaeology because v0.28 owns DFlash2 natively.
    runner: v1
    activation: historical
    active: false
    status: retired-historical
    provenance: {kind: historical-upstream-backport, evidence: docs/V028_UPGRADE.md}
    remove_when: null
  patch_dflash_base:
    v030_disposition: RETAIN_UNCHANGED
    areas: [dflash, speculative]
    reason: Install Radiance DFlash integration hooks on top of vLLM's native DFlash2 implementation.
    runner: v2
  patch_dflash_fused_kv_fp8:
    v030_disposition: RETAIN_UNCHANGED
    areas: [dflash, fp8-kv, speculative]
    reason: Preserve fused FP8 KV handling required by the qualified DFlash lane.
    runner: v2
  patch_dflash_logits_cache_stride:
    v030_disposition: UPSTREAM_OWNED
    active: false
    activation: historical
    status: upstream-owned-v030
    areas: [dflash, speculative, correctness]
    reason: Backport the post-v0.28 DFlash logits-cache stride/width correctness fix.
    runner: v2
    provenance: {kind: upstream-backport, upstream_pr: 'vLLM #53017', upstream_commit: d4f4d3f40fc5350a71777fcb0e5eb8a57bda631f, evidence: docs/V028_UPGRADE.md}
  patch_dflash_selector_topk:
    v030_disposition: RETAIN_UNCHANGED
    areas: [dflash, sampling, experimental]
    reason: Expose the DFlash selector top-k experimental control while preserving the checkpoint default.
    runner: v2
  patch_dflash_w4:
    v030_disposition: RETAIN_UNCHANGED
    areas: [dflash, quantization, draft]
    reason: Integrate Radiance W4 draft-linears for the opt-in fast DFlash path.
    runner: v2
  patch_dynamo_metrics:
    v030_disposition: RETAIN_UNCHANGED
    areas: [metrics, dynamo]
    reason: Expose/retain metrics required to diagnose compiled serving behavior.
    runner: both
  patch_dynwidth:
    v030_disposition: MECHANICAL_PORT
    areas: [dflash, scheduler, speculative]
    reason: Apply per-request DFlash verification-width policy from observed acceptance.
    runner: v2
    provenance: {kind: selective-adaptation, source: ggz14/radiance-vllm-mxfp4 lineage, evidence: docs/RADIANCE_093_R4D050_MXFP4.md}
  patch_fp8_kv_sidecar:
    v030_disposition: RETAIN_UNCHANGED
    areas: [fp8-kv, calibration]
    reason: Support immutable checkpoint-bound FP8 KV calibration sidecars as an opt-in fidelity laboratory.
    runner: both
  patch_from_json_filter:
    v030_disposition: RETAIN_UNCHANGED
    areas: [parser, serialization]
    reason: Retain JSON filtering compatibility used by the serving/tooling path.
    runner: independent
  patch_gdn_aiter_prefill:
    v030_disposition: RETAIN_UNCHANGED
    areas: [gdn, aiter, prefill]
    reason: Provide the explicit AITER GDN prefill bridge retained as a measured opt-in path.
    runner: both
  patch_gdn_merge_inproj:
    v030_disposition: MECHANICAL_PORT
    areas: [gdn, gemm, performance]
    reason: Merge compatible GDN input projections at load time to reduce launch overhead.
    runner: both
    provenance: {kind: selective-adaptation, source: ggz14/radiance-vllm-mxfp4 lineage, evidence: docs/MXFP4_RX4_CONTINUATION.md}
  patch_gdn_metadata:
    v030_disposition: MECHANICAL_PORT
    areas: [gdn, speculative]
    reason: Provide exact GPU GDN metadata used by speculative execution.
    runner: both
  patch_gdn_shared_build:
    v030_disposition: RETAIN_UNCHANGED
    areas: [gdn, speculative, performance]
    reason: Share equivalent speculative GDN metadata construction across KV groups.
    runner: both
  patch_gdn_wmma:
    v030_disposition: RETAIN_UNCHANGED
    areas: [gdn, rocm, wmma]
    reason: Apply the gfx1201 WMMA triangular-solve path used by qualified GDN execution.
    runner: both
  patch_gfx1201:
    v030_disposition: RETAIN_UNCHANGED
    areas: [gfx1201, rocm, build]
    reason: Enable/guard gfx1201-specific vLLM behavior required by the qualified R9700 stack.
    runner: both
  patch_kv_group_size:
    v030_disposition: RETAIN_UNCHANGED
    areas: [kv-cache, capacity]
    reason: Select hybrid KV group size by measured capacity cost rather than smallest-bucket padding.
    runner: both
  patch_kv_offload_lifecycle:
    v030_disposition: MECHANICAL_PORT
    areas: [kv-offload, lifecycle]
    reason: Verify upstream-owned mmap lifetime without rewriting it; chain the separate rank-sharded opt-in.
    runner: independent
    provenance: {kind: upstream-backport-plus-radiance-extension, upstream_pr: 'vLLM #52596', upstream_commit: 4c58a0c398b056b135b98bd93c644945be7e3109, evidence: patch_kv_offload_lifecycle.py}
  patch_kv_offload_rank_sharded:
    v030_disposition: SEMANTIC_PORT
    areas: [kv-offload, tp2, experimental]
    reason: Add the opt-in rank-major CPU KV layout; invoked transitively by the lifecycle overlay.
    runner: independent
    activation: indirect
    status: radiance-extension
  patch_kv_offload_registration:
    v030_disposition: SEMANTIC_PORT
    areas: [kv-offload, rocm]
    reason: Harden mmap host registration, HIP error draining, and coherent TP fallback.
    runner: independent
  patch_kv_offload_restore:
    v030_disposition: SEMANTIC_PORT
    areas: [kv-offload, restore]
    reason: Repair native CPU KV restore/group handling for qualified hybrid/speculative layouts.
    runner: independent
  patch_mtp_loopbreak:
    v030_disposition: RETAIN_UNCHANGED
    areas: [mtp, speculative]
    reason: Preserve Radiance MTP loop termination/controller behavior.
    runner: both
  patch_mtp_mm_mask:
    v030_disposition: RETAIN_UNCHANGED
    areas: [mtp, speculative]
