    reason: Install Radiance runtime hooks into the pinned vLLM tree.
    runner: both
  patch_nvfp4_mxfp4:
    areas: [mxfp4, nvfp4, quantization]
    reason: Bounded NVFP4-only load-time conversion with per-partition scale provenance.
    runner: both
    v030_disposition: SEMANTIC_PORT
    provenance: {kind: selective-adaptation, source: 'https://github.com/GGZ14/vllm-mxfp4', upstream_commit: 31b9a94a7f74eeb3f59e66d16b1b27dfafcd0663, evidence: docs/V030_GGZ14_MXFP4_NVFP4.md}
