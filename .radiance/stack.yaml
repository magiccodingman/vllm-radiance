schema_version: 1
target:
  primary_gpu: AMD Radeon AI PRO R9700
  gfx_arch: gfx1201
  primary_topology: TP2
  qualification_note: Other geometries may work, but dual R9700 TP2 is the primary qualified environment.
atomic_groups:
- id: rocm-compiler-stack
  members:
  - rocm
  - pytorch
  - triton
  - torchvision
  - aiter
  - vllm
  policy: Treat as a coordinated compatibility stack; do not independently bump members without explicit qualification.
components:
- id: rocm
  version: 10.0.0
  source: rocm/dev-ubuntu-24.04
  docker_arg: ROCM_BASE
  docker_value_contains: 10.0.0-full@sha256:a90cf047f615abe70fbef83c64def0a2d549ef37a39c8ea545430aba4981b374
  build: base-image
- id: pytorch
  version: 2.13.0
  repository: https://github.com/ROCm/pytorch.git
  commit: 0e8e47fd5bb5cd734b6194b92e941075e932c925
  docker_args:
    TORCH_VERSION: 2.13.0
    TORCH_COMMIT: 0e8e47fd5bb5cd734b6194b92e941075e932c925
  build: source
- id: triton
  version: 3.8.0
  repository: https://github.com/ROCm/triton.git
  commit: 669b31acc1dd1b3fd93286afd5db67f65d9f7557
  docker_args:
    TRITON_VERSION: 3.8.0
    TRITON_COMMIT: 669b31acc1dd1b3fd93286afd5db67f65d9f7557
  build: source
- id: torchvision
  version: 0.28.0
  repository: https://github.com/pytorch/vision.git
  docker_args:
    TORCHVISION_VERSION: 0.28.0
  build: source
- id: aiter
  version: 0.1.26
  repository: https://github.com/ROCm/aiter.git
  commit: 84077b3c0461dac1f0f3f8b9590a9282e2035a2f
  docker_args:
    AITER_VERSION: 0.1.26
    AITER_COMMIT: 84077b3c0461dac1f0f3f8b9590a9282e2035a2f
  build: source
  notes: Built for gfx1201 with runtime JIT support and system Triton.
- id: vllm
  version: 0.33.0
  repository: https://github.com/vllm-project/vllm.git
  commit: 4ba787ec9959e566d3b587a796dff07673324da5
  docker_args:
    VLLM_VERSION: 0.33.0
    VLLM_COMMIT: 4ba787ec9959e566d3b587a796dff07673324da5
  build: source
  policy: stable-release-plus-reviewed-focused-followups
- id: transformers
  version: 5.16.1
  repository: https://github.com/huggingface/transformers
  docker_args:
    TRANSFORMERS_VERSION: 5.16.1
  build: pypi
- id: xgrammar
  version: 0.2.8
  repository: https://github.com/mlc-ai/xgrammar
  docker_args:
    XGRAMMAR_VERSION: 0.2.8
  build: pypi
- id: libr4d
  version: 0.5.0+rdna4.451b136
  repository: https://codeberg.org/StillDeadcode/libr4d.git
  commit: e8de4bc1f3dbd608dcb8d3ffceb6b48acdf83bb7
  docker_args:
    R4D_VERSION: 0.5.0+rdna4.451b136
    R4D_COMMIT: e8de4bc1f3dbd608dcb8d3ffceb6b48acdf83bb7
  build: source-with-maintained-family-adapter
  maintained_repository: https://codeberg.org/StillDeadcode/radiance.git
  maintained_commit: 451b136874084650992668bed9e8662deb58de88
- id: flydsl
  version: 0.4.0
  build: pypi
  docker_args:
    FLYDSL_VERSION: 0.4.0
