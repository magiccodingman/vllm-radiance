services:
  vllm-radiance:
    image: ${RADIANCE_IMAGE:-vllm-radiance:dev}
#    image: vllm-radiance-lmcache:0.1.5
    container_name: vllm-radiance-r9700
    restart: "no"

    command:
      - /models/Qwen3.8-27B-heretic-ara-fp8-magiccodingman
      - --served-model-name=Qwen3.8-27B-heretic-ara-fp8
      - --quantization=fp8
#      - --cpu-offload-gb=24
#      - --kv-offloading-size=24
#      - --kv-offloading-backend=native
#      - --kv-offloading-backend=lmcache
#      - --mamba-cache-mode=align
      - --kv-cache-dtype=fp8
      - --tensor-parallel-size=2
      - --gpu-memory-utilization=0.85
      - --max-model-len=16384
      - --max-num-seqs=8
      - --max-num-batched-tokens=2048
      - --attention-backend=ROCM_AITER_UNIFIED_ATTN
#      - '--speculative-config={"method":"mtp","num_speculative_tokens":8,"attention_backend":"ROCM_AITER_UNIFIED_ATTN","disable_padded_drafter_batch":true}'
      - --no-async-scheduling
      - --host=0.0.0.0
      - --port=8000
      - --enable-tokenizer-info-endpoint
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
      - --language-model-only


    environment:
      HIP_VISIBLE_DEVICES: "0,1"

      VLLM_ROCM_USE_AITER: "${VLLM_ROCM_USE_AITER:-1}"
      VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION: "${VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION:-1}"
      VLLM_ROCM_USE_AITER_MHA: "${VLLM_ROCM_USE_AITER_MHA:-0}"
      VLLM_ROCM_USE_AITER_MLA: "${VLLM_ROCM_USE_AITER_MLA:-0}"
      VLLM_ROCM_USE_AITER_MOE: "${VLLM_ROCM_USE_AITER_MOE:-0}"
      VLLM_ROCM_USE_AITER_LINEAR: "${VLLM_ROCM_USE_AITER_LINEAR:-0}"
      VLLM_ROCM_USE_AITER_FP8BMM: "${VLLM_ROCM_USE_AITER_FP8BMM:-0}"
      VLLM_ROCM_USE_AITER_FP4BMM: "${VLLM_ROCM_USE_AITER_FP4BMM:-0}"
      VLLM_ROCM_USE_AITER_RMSNORM: "${VLLM_ROCM_USE_AITER_RMSNORM:-0}"
      VLLM_USE_V2_MODEL_RUNNER: "${VLLM_USE_V2_MODEL_RUNNER:-}"

      NCCL_PROTO: "Simple"

      RADIANCE_PRESHUFFLE: "${RADIANCE_PRESHUFFLE:-1}"
      RADIANCE_ATTN_TUNE: "${RADIANCE_ATTN_TUNE:-1}"
      RADIANCE_FAST_REDUCE: "${RADIANCE_FAST_REDUCE:-1}"
      RADIANCE_AR_MAX_KB: "${RADIANCE_AR_MAX_KB:-32768}"
      RADIANCE_FUSE_RMS_QUANT: "${RADIANCE_FUSE_RMS_QUANT:-1}"
      RADIANCE_DYNAMIC_DRAFT: "${RADIANCE_DYNAMIC_DRAFT:-1}"
      RADIANCE_NGRAM_EXTENSION: "${RADIANCE_NGRAM_EXTENSION:-1}"

      VLLM_CACHE_ROOT: /cache/vllm
      TORCHINDUCTOR_CACHE_DIR: /cache/inductor
      TRITON_CACHE_DIR: /cache/triton
      TRITON_CACHE_AUTOTUNING: "1"

      LMCACHE_LOCAL_CPU: "True"
      LMCACHE_MAX_LOCAL_CPU_SIZE: "24.0"
      LMCACHE_LOCAL_DISK: "file:///cache/lmcache"
      LMCACHE_MAX_LOCAL_DISK_SIZE: "500.0"
      LMCACHE_CHUNK_SIZE: "256"
      LMCACHE_EXTRA_CONFIG: '{"use_odirect":true,"disk_io_threads":8}'

      RADIANCE_GDN_WMMA: "${RADIANCE_GDN_WMMA:-1}"
      RADIANCE_VIT_FLASH: "${RADIANCE_VIT_FLASH:-1}"
      RADIANCE_AR_QUANT: "${RADIANCE_AR_QUANT:-1}"
      RADIANCE_AR_QUANT_MIN_KB: "${RADIANCE_AR_QUANT_MIN_KB:-128}"

      AITER_ROOT_DIR: /cache/aiter
      HIP_FORCE_DEV_KERNARG: "${HIP_FORCE_DEV_KERNARG:-0}"
      TORCH_BLAS_PREFER_HIPBLASLT: "${TORCH_BLAS_PREFER_HIPBLASLT:-0}"


    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

    group_add:
      - "${RENDER_GID}"
      - "${VIDEO_GID}"

    ipc: host

    cap_add:
      - SYS_PTRACE

    security_opt:
      - seccomp=unconfined

    ports:
      - "11435:8000"

    volumes:
      - /nvme/lexar-2/ai/models:/models:ro
      - /nvme/ediloca-1/scratch/vllm-radiance-cache:/cache
