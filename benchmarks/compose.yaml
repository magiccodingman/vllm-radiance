services:
  vllm-radiance:
    image: ${RADIANCE_IMAGE:-vllm-radiance:dev}
#    image: vllm-radiance-lmcache:0.1.5
    container_name: vllm-radiance-r9700
    restart: "no"

    command:
      - /models/Qwen3.8-27B-heretic-ara-fp8-magiccodingman
      - --served-model-name=Qwen3.8-27B-heretic-ara-fp8
      - --quantization=fp8
#      - --cpu-offload-gb=24
#      - --kv-offloading-size=24
#      - --kv-offloading-backend=native
#      - --kv-offloading-backend=lmcache
#      - --mamba-cache-mode=align
      - --kv-cache-dtype=fp8
      - --tensor-parallel-size=2
      - --gpu-memory-utilization=0.85
      - --max-model-len=16384
      - --max-num-seqs=8
      - --max-num-batched-tokens=${MAX_NUM_BATCHED_TOKENS:-4096}
      - --attention-backend=R4D
#      - '--speculative-config={"method":"mtp","num_speculative_tokens":8,"attention_backend":"R4D","disable_padded_drafter_batch":true}'
      - --no-async-scheduling
      - --host=0.0.0.0
      - --port=8000
      - --enable-tokenizer-info-endpoint
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
      - --language-model-only


    environment:
      HIP_VISIBLE_DEVICES: "0,1"

      VLLM_ROCM_USE_AITER: "${VLLM_ROCM_USE_AITER:-1}"
      VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION: "${VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION:-1}"
      VLLM_ROCM_USE_AITER_MHA: "${VLLM_ROCM_USE_AITER_MHA:-0}"
      VLLM_ROCM_USE_AITER_MLA: "${VLLM_ROCM_USE_AITER_MLA:-0}"
      VLLM_ROCM_USE_AITER_MOE: "${VLLM_ROCM_USE_AITER_MOE:-0}"
      VLLM_ROCM_USE_AITER_LINEAR: "${VLLM_ROCM_USE_AITER_LINEAR:-0}"
      VLLM_ROCM_USE_AITER_FP8BMM: "${VLLM_ROCM_USE_AITER_FP8BMM:-0}"
      VLLM_ROCM_USE_AITER_FP4BMM: "${VLLM_ROCM_USE_AITER_FP4BMM:-0}"
      VLLM_ROCM_USE_AITER_RMSNORM: "${VLLM_ROCM_USE_AITER_RMSNORM:-0}"
      NCCL_PROTO: "Simple"

      RADIANCE_PRESHUFFLE: "${RADIANCE_PRESHUFFLE:-1}"
      RADIANCE_ATTN_TUNE: "${RADIANCE_ATTN_TUNE:-1}"
      RADIANCE_USE_R4D: "${RADIANCE_USE_R4D:-1}"
      RADIANCE_USE_R4D_GDN: "${RADIANCE_USE_R4D_GDN:-1}"
      R4D_ATTN_FP8: "${R4D_ATTN_FP8:-0}"
      RADIANCE_R4D_REPORT: "${RADIANCE_R4D_REPORT:-1}"
      RADIANCE_USE_R4D_AR: "${RADIANCE_USE_R4D_AR:-1}"
      RADIANCE_USE_R4D_AR_QUANT: "${RADIANCE_USE_R4D_AR_QUANT:-1}"
      RADIANCE_SKINNY_GEMM: "${RADIANCE_SKINNY_GEMM:-1}"
      RADIANCE_GDN_META: "${RADIANCE_GDN_META:-1}"
      RADIANCE_GDN_MERGE_INPROJ: "${RADIANCE_GDN_MERGE_INPROJ:-1}"
      RADIANCE_GDN_FUSED_UPDATE: "${RADIANCE_GDN_FUSED_UPDATE:-1}"
      RADIANCE_GDN_SHARED_BUILD: "${RADIANCE_GDN_SHARED_BUILD:-1}"
      RADIANCE_TOPK_TRITON_MIN_ROWS: "${RADIANCE_TOPK_TRITON_MIN_ROWS:-1}"
      RADIANCE_TOPK_COMPOSITE: "${RADIANCE_TOPK_COMPOSITE:-1}"
      RADIANCE_TOPK_COMPOSITE_KCAP: "${RADIANCE_TOPK_COMPOSITE_KCAP:-64}"
      RADIANCE_FUSE_RMS_QUANT: "${RADIANCE_FUSE_RMS_QUANT:-1}"
      RADIANCE_DYNAMIC_DRAFT: "${RADIANCE_DYNAMIC_DRAFT:-1}"
      RADIANCE_NGRAM_EXTENSION: "${RADIANCE_NGRAM_EXTENSION:-1}"
      RADIANCE_DRAFT_SCHEDULE: "${RADIANCE_DRAFT_SCHEDULE:-1:8,2:7,4:6,8:5,16:4}"
      RADIANCE_DRAFT_TAU: "${RADIANCE_DRAFT_TAU:-0.28}"
      RADIANCE_FAST_DRAFT: "${RADIANCE_FAST_DRAFT:-0}"
      RADIANCE_DRAFT_RERANK: "${RADIANCE_DRAFT_RERANK:-64}"
      RADIANCE_DFLASH_SELECTOR_TOPK: "${RADIANCE_DFLASH_SELECTOR_TOPK:-}"
      RADIANCE_VERIFY_HEAD: "${RADIANCE_VERIFY_HEAD:-1}"
      RADIANCE_DYNAMIC_WIDTH: "${RADIANCE_DYNAMIC_WIDTH:-1}"
      RADIANCE_DYNW_MIN_BATCH: "${RADIANCE_DYNW_MIN_BATCH:-5}"
      RADIANCE_MXFP4: "${RADIANCE_MXFP4:-0}"
      RADIANCE_MXFP4_W4A8: "${RADIANCE_MXFP4_W4A8:-0}"
      RADIANCE_MXFP4_W4A8_MIN_M: "${RADIANCE_MXFP4_W4A8_MIN_M:-0}"
      RADIANCE_MXFP4_DECODE_MAX_M: "${RADIANCE_MXFP4_DECODE_MAX_M:-64}"
      RADIANCE_MXFP4_TN4_MIN_M: "${RADIANCE_MXFP4_TN4_MIN_M:-2048}"
      RADIANCE_MXFP4_EPIFAST: "${RADIANCE_MXFP4_EPIFAST:-1}"
      RADIANCE_MXFP4_WPERM: "${RADIANCE_MXFP4_WPERM:-0}"
      RADIANCE_NORMQUANT_FUSION: "${RADIANCE_NORMQUANT_FUSION:-0}"
      RADIANCE_FP8_STREAM: "${RADIANCE_FP8_STREAM:-0}"
      RADIANCE_COMPILATION_CONFIG: "${RADIANCE_COMPILATION_CONFIG:-}"
      RADIANCE_QUARK_BF16_MTP: "${RADIANCE_QUARK_BF16_MTP:-0}"
      RADIANCE_MXFP4_SANITIZE: "${RADIANCE_MXFP4_SANITIZE:-0}"
      RADIANCE_MXFP4_DEBUG: "${RADIANCE_MXFP4_DEBUG:-0}"
      RADIANCE_MXFP4_SYNC: "${RADIANCE_MXFP4_SYNC:-0}"
      RADIANCE_MXFP4_CHECKX: "${RADIANCE_MXFP4_CHECKX:-0}"
      RADIANCE_MXFP4_CHECKALL: "${RADIANCE_MXFP4_CHECKALL:-}"
      RADIANCE_MXFP4_KERNEL_N: "${RADIANCE_MXFP4_KERNEL_N:-}"
      RADIANCE_MXFP4_KERNEL_NK: "${RADIANCE_MXFP4_KERNEL_NK:-}"
      RADIANCE_MXFP4_PERBLOCK_NK: "${RADIANCE_MXFP4_PERBLOCK_NK:-}"
      RADIANCE_AR_MAX_KB: "${RADIANCE_AR_MAX_KB:-49152}"
      RADIANCE_AR_QUANT_MIN_KB: "${RADIANCE_AR_QUANT_MIN_KB:-128}"
      RADIANCE_AR_QNT: "${RADIANCE_AR_QNT:-1024}"
      RADIANCE_AR_QNB: "${RADIANCE_AR_QNB:-96}"
      RADIANCE_KV_GROUP_OPT: "${RADIANCE_KV_GROUP_OPT:-1}"

      VLLM_CACHE_ROOT: "${CONTAINER_VLLM_CACHE_ROOT:-/cache/vllm}"
      TORCHINDUCTOR_CACHE_DIR: "${CONTAINER_TORCHINDUCTOR_CACHE_DIR:-/cache/inductor}"
      RADIANCE_GRAPH_CACHE_NAMESPACE: "${RADIANCE_GRAPH_CACHE_NAMESPACE:-1}"
      TRITON_CACHE_DIR: /cache/triton
      TRITON_CACHE_AUTOTUNING: "1"

      LMCACHE_LOCAL_CPU: "True"
      LMCACHE_MAX_LOCAL_CPU_SIZE: "24.0"
      LMCACHE_LOCAL_DISK: "file:///cache/lmcache"
      LMCACHE_MAX_LOCAL_DISK_SIZE: "500.0"
      LMCACHE_CHUNK_SIZE: "256"
      LMCACHE_EXTRA_CONFIG: '{"use_odirect":true,"disk_io_threads":8}'

      AITER_ROOT_DIR: /cache/aiter
      HIP_FORCE_DEV_KERNARG: "${HIP_FORCE_DEV_KERNARG:-0}"
      TORCH_BLAS_PREFER_HIPBLASLT: "${TORCH_BLAS_PREFER_HIPBLASLT:-0}"


    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri

    group_add:
      - "${RENDER_GID}"
      - "${VIDEO_GID}"

    ipc: host

    cap_add:
      - SYS_PTRACE

    security_opt:
      - seccomp=unconfined

    ports:
      - "11435:8000"

    volumes:
      - /nvme/lexar-2/ai/models:/models:ro
      - /nvme/ediloca-1/scratch/vllm-radiance-cache:/cache
