[project]
name = "radiance-conformance"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "jsonschema>=4.23,<5",
    "PyYAML>=6",
    "psutil>=6",
    "requests>=2",
    "safetensors>=0.5",
]

[project.optional-dependencies]
cpu-tests = [
    "torch>=2.14.0",
]

[dependency-groups]
dev = ["pytest>=8", "z3-solver>=4.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_r9700_lab"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
