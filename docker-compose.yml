# Portable Qwen3.8-27B FP8 serve profile for dual R9700 (gfx1201).
# Launch from this directory:
#     docker compose up -d          # start (detached); poll `docker compose logs -f`
#     docker compose down           # stop + remove
#     docker compose restart        # restart in place
#
# Host-specific paths and GPU IDs belong in .env or an ignored
# docker-compose.dev.yml overlay. See .env.example and
# docker-compose.dev.example.yml. Never add local paths to this file.
#
# The image ENTRYPOINT is radiance_entrypoint.sh (RADIANCE banner + env prechecks, then
# `exec vllm serve "$@"`); `command:` below supplies the args.
# Tunable knobs are ${VAR:-default}: override via the shell or a .env file WITHOUT editing
# this file, e.g.: MAX_NUM_SEQS=2 MAX_MODEL_LEN=32768 docker compose up -d
services:
  vllm:
    image: ${IMAGE:-magiccodingman/vllm-radiance:latest}
    container_name: vllm-radiance
    restart: unless-stopped
    command:
      - ${MODEL_PATH:-/models/model}
      - --served-model-name=${SERVED_MODEL_NAME:-radiance-model}
      - --quantization=${WEIGHT_QUANTIZATION:-fp8}
      - --tensor-parallel-size=${TP:-2}
      # Admission ceiling, not a promise that every sequence can simultaneously
      # reach MAX_MODEL_LEN. Select both values from the capacity guide in README.
      # Measured conservative TP2 Qwen3.8 FP8+DFlash pairs at GPU_UTIL=0.85:
      #   8K:8, 16K:7, 32K:5, 64K:3, 128K:2, 256K:1
      # These are model/profile-specific; other checkpoints must be requalified.
      - --max-num-seqs=${MAX_NUM_SEQS:-8}
      - --max-model-len=${MAX_MODEL_LEN:-16384}
      - --gpu-memory-utilization=${GPU_UTIL:-0.85}
      # chunk size that works well at long context (chunked prefill). MTP also forces
      # max_num_scheduled_tokens=2048, so this just makes it explicit.
      - --max-num-batched-tokens=${MAX_NUM_BATCHED_TOKENS:-2048}
      - --kv-cache-dtype=fp8
      - --attention-backend=ROCM_AITER_UNIFIED_ATTN
      # Automatic prefix caching (APC) for shared prefixes (system prompts, RAG / agentic context).
      # Both flags are required and ON here: this is a GDN hybrid, and hybrid models default their APC
      # support flag off ("experimental"), so vLLM SILENTLY disables prefix caching unless
      # --enable-prefix-caching is passed explicitly. --mamba-cache-mode=align makes the linear-attention
      # (GDN) layers prefix-cacheable too, snapshotting + restoring their conv + recurrent state at block
      # boundaries; this is verified bit-identical to full recompute (including under MTP). Effect:
      # large TTFT drop on shared prefixes (~3.6x measured). Note: align reconciles the mamba/attention
      # page sizes, which raises the attention block size to 1664 tokens and uses one extra state block
      # per linear-attn layer (slightly lower max concurrency at full context). Remove both flags to
      # disable. Do NOT use --mamba-cache-mode=all (unsupported by this model) and do NOT set
      # VLLM_SSM_CONV_STATE_LAYOUT=DS (asserts under MTP + align).
      - --enable-prefix-caching
      - --mamba-cache-mode=align
      # MTP self-speculation. nspec=8 default: RADIANCE dynamic-draft caps the actual MTP depth
      # by confidence, so 8 is the ceiling not a fixed cost. nspec=16 is an option for more verbatim
      # upside (editing/RAG) but needs GPU_UTIL=0.90 to stay safe at 8 concurrent sequences (else CUDA OOM).
      # Baseline serving is deliberately non-speculative. Enable this explicitly
      # for the separate MTP milestone after validating the base engine.
      # - '--speculative-config={"method":"mtp","num_speculative_tokens":${MTP_NSPEC:-8},"attention_backend":"ROCM_AITER_UNIFIED_ATTN","disable_padded_drafter_batch":true}'
      # disable_padded_drafter_batch (above) is incompatible with async scheduling; vLLM would
      # otherwise auto-enable async then disable it with a runtime warning. Turn it off explicitly.
      - --no-async-scheduling
      # agentic serving: XML tool calls + qwen3 reasoning + the fixed chat template
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --reasoning-parser=qwen3
      - --chat-template=/work/qwen3.8-enhanced.jinja
      - --language-model-only
      - --trust-remote-code
      - --host=0.0.0.0
      - --port=8000
    environment:
      # GPU visibility: select your two R9700s by HIP index (exclude any iGPU). Never CUDA_VISIBLE_DEVICES.
      HIP_VISIBLE_DEVICES: "${HIP_VISIBLE_DEVICES:-0,1}"
      HIP_FORCE_DEV_KERNARG: ${HIP_FORCE_DEV_KERNARG:-0}
      TORCH_BLAS_PREFER_HIPBLASLT: ${TORCH_BLAS_PREFER_HIPBLASLT:-0}
      # AITER: unified attention ON, every other AITER path OFF (LINEAR=1 crashes on gfx1201).
      VLLM_ROCM_USE_AITER: "1"
      VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION: "1"
      VLLM_ROCM_USE_AITER_MHA: "0"
      VLLM_ROCM_USE_AITER_MLA: "0"
      VLLM_ROCM_USE_AITER_MOE: "0"
      VLLM_ROCM_USE_AITER_LINEAR: "0"
      VLLM_ROCM_USE_AITER_FP8BMM: "0"
      VLLM_ROCM_USE_AITER_FP4BMM: "0"
      VLLM_ROCM_USE_AITER_RMSNORM: "0"
      # radiance rms+group-fp8-quant fusion coverage fix (also baked default 1; explicit here).
      RADIANCE_FUSE_RMS_QUANT: "1"
      # gated-delta-net KKt gram on the fp16 matrix cores (WMMA) instead of the fp32 scalar path;
      # much faster prefill + cold start on RDNA4. Baked default 1; set "0" for the stock fp32 dot.
      RADIANCE_GDN_WMMA: "1"
      # native head_dim-72 flash attention for the vision encoder (multimodal). ~1.5-2x vs SDPA on
      # RDNA4; only used when serving vision (no effect under --language-model-only). Default 1.
      RADIANCE_VIT_FLASH: "1"
      # fp8 all-reduce payload for large (prefill) messages; baked ON. Not bit-identical to RCCL;
      # set "0" for the exact bf16 all-reduce.
      RADIANCE_AR_QUANT: "1"
      # optional NUMA pinning of the vLLM fleet to the GPU-local node(s). Off by default (no-op on
      # single-node hosts). Set "auto" to detect, or explicit nodes (e.g. "0" / "0,1"). Requires the
      # SYS_NICE cap above. Equivalent to passing --numa-bind in command:.
      RADIANCE_NUMA_BIND: "${RADIANCE_NUMA_BIND:-}"
      # RADIANCE dynamic drafting (baked ON in the image; explicit here for visibility/overridability).
      # Per-request MTP draft-depth control: a per-slot confidence gate picks the draft depth and takes
      # free-win n-grams; the schedule caps serial MTP forwards by batch size. Set DYNAMIC_DRAFT="0" to
      # disable (byte-identical stock MTP). The two knobs below are the only tunables.
      RADIANCE_DYNAMIC_DRAFT: "1"
      RADIANCE_DRAFT_SCHEDULE: "1:8,2:7,4:6,8:5,16:4"
      RADIANCE_DRAFT_TAU: "0.35"
      # custom bf16 MoE-gate GEMM for the n in [6,16] band rocBLAS serves poorly (fine-grained MoE,
      # e.g. Qwen3.6-35B-A3B). Baked ON; inert for models whose gate is not [256,2048]. Set "0" for rocBLAS.
      RADIANCE_MOE_ROUTER: "1"
      NCCL_PROTO: Simple
      # throttle inductor compile workers to limit peak compile-time RAM (defensive).
      TORCHINDUCTOR_COMPILE_THREADS: "4"
      # persistent compile caches -> fast warm restarts (a cold cache spends a few extra minutes
      # compiling Triton/inductor kernels before the engine comes up). Mounted below.
      VLLM_CACHE_ROOT: /cache/vllm
      TORCHINDUCTOR_CACHE_DIR: /cache/inductor
      TRITON_CACHE_DIR: /cache/triton
      AITER_ROOT_DIR: /cache/aiter
      TRITON_CACHE_AUTOTUNING: "1"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    # The image runs as root, so mapped devices do not require host-specific
    # supplemental GIDs. A non-root local deployment can add group_add in its
    # ignored developer overlay using the host's render/video numeric GIDs.
    cap_add:
      - SYS_PTRACE            # py-spy
      - SYS_NICE              # numactl mempolicy syscalls (only needed if you enable RADIANCE_NUMA_BIND)
    security_opt:
      - seccomp=unconfined
    ipc: host
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Portable fallbacks stay beneath the checkout. Production and developer
      # deployments should override these in .env or docker-compose.dev.yml.
      - ${MODELS:-./models}:/models:ro
      - ${VLLM_CACHE:-./vllm-cache}:/cache
      - ${WORK:-.}:/work:ro                        # supplies /work/qwen3.8-enhanced.jinja (this repo directory)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 1800s     # generous: a cold cache compiles kernels before the engine comes up,
                              # and a long --max-model-len adds graph-capture time
